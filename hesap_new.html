<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Getiri Takipçisi</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --input-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 16px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* --- Header & Dashboard Card --- */
        .dashboard-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .main-goal {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
        }

        .main-goal h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .main-goal .amount {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -1px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .input-group input {
            background-color: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary);
        }

        .reset-btn {
            grid-column: 1 / -1;
            background-color: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background-color: var(--danger);
            color: white;
        }

        /* --- Week Cards (List View) --- */
        .weeks-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .week-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.2s;
        }

        .week-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
        }

        .week-title {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .week-title span {
            background-color: var(--card-border);
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 9999px;
            font-weight: 600;
        }

        .target-amount {
            font-size: 1rem;
            color: var(--text-muted);
            text-align: right;
        }
        
        .target-amount strong {
            color: var(--text-main);
        }

        .week-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .actual-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .actual-input-wrapper span {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .actual-input {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px 16px 12px 48px;
            border-radius: 8px;
            font-size: 1.125rem;
            font-weight: 700;
            outline: none;
            transition: border-color 0.2s;
        }

        .actual-input:focus {
            border-color: var(--primary);
        }

        .actual-input::placeholder {
            color: var(--card-border);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 700;
            background-color: var(--card-border);
            color: var(--text-muted);
            text-align: center;
        }

        .status-badge.green { background-color: rgba(16, 185, 129, 0.2); color: var(--success); }
        .status-badge.orange { background-color: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .status-badge.red { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); }

        /* Tablet & Desktop Layout */
        @media (min-width: 600px) {
            .week-card {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                padding: 16px 24px;
            }
            .week-header {
                border-bottom: none;
                padding-bottom: 0;
                flex: 1;
                justify-content: flex-start;
                gap: 24px;
            }
            .week-body {
                flex: 2;
                flex-direction: row;
                align-items: center;
                justify-content: flex-end;
                gap: 16px;
            }
            .actual-input-wrapper {
                width: 200px;
            }
            .status-badge {
                width: 120px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Dashboard & Ayarlar -->
    <div class="dashboard-card">
        <div class="main-goal">
            <h1>52 Hafta Sonunda Hedeflenen Tutar</h1>
            <div class="amount" id="finalGoalDisplay">0 ₺</div>
        </div>
        <div class="settings-grid">
            <div class="input-group">
                <label for="inpCapital">Başlangıç Sermayesi (₺)</label>
                <input type="number" id="inpCapital" value="100000" oninput="renderApp()">
            </div>
            <div class="input-group">
                <label for="inpRate">Haftalık Hedef Getiri (%)</label>
                <input type="number" id="inpRate" value="5" step="0.1" oninput="renderApp()">
            </div>
            <button class="reset-btn" onclick="clearData()">Tüm İlerlemeyi Sıfırla</button>
        </div>
    </div>

    <!-- Hafta Listesi -->
    <div class="weeks-container" id="weeksContainer">
        <!-- Kartlar JS ile oluşturulacak -->
    </div>
</div>

<script>
    const STORAGE_KEY = 'proCompoundTrackerData';
    let actuals = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};

    // TL Formatlayıcı
    const formatTL = (num) => {
        return new Intl.NumberFormat('tr-TR', { 
            minimumFractionDigits: 0, 
            maximumFractionDigits: 1 
        }).format(num);
    };

    function clearData() {
        if(confirm("Tüm ulaşılan tutar verileriniz silinecek. Onaylıyor musunuz?")) {
            actuals = {};
            localStorage.removeItem(STORAGE_KEY);
            renderApp();
        }
    }

    function handleInput(week) {
        const val = document.getElementById(`actual-${week}`).value;
        if (val === '') {
            delete actuals[week];
        } else {
            actuals[week] = parseFloat(val);
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(actuals));
        renderApp(); // Tüm durumu yeniden hesapla
    }

    function renderApp() {
        const capitalInput = document.getElementById('inpCapital').value;
        const rateInput = document.getElementById('inpRate').value;
        
        const capital = parseFloat(capitalInput) || 0;
        const targetRate = parseFloat(rateInput) || 0;
        const rateDec = targetRate / 100;

        // Ana Hedef Ekranını Güncelle
        const finalAmt = capital * Math.pow(1 + rateDec, 52);
        document.getElementById('finalGoalDisplay').innerText = formatTL(finalAmt) + " ₺";

        const container = document.getElementById('weeksContainer');
        container.innerHTML = '';

        let prevActual = capital; // Hesaplama bazı: Başlangıçta anapara

        for (let w = 1; w <= 52; w++) {
            const targetAmt = capital * Math.pow(1 + rateDec, w);
            const currentActual = actuals[w];
            
            let gainDisplay = '-';
            let badgeClass = '';

            // Getiri Hesaplama ve Renklendirme Mantığı
            if (currentActual !== undefined && currentActual !== '') {
                const gainRate = ((currentActual - prevActual) / prevActual) * 100;
                gainDisplay = (gainRate > 0 ? '+' : '') + gainRate.toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2}) + '%';
                
                if (gainRate >= targetRate) {
                    badgeClass = 'green';
                } else if (gainRate >= 0 && gainRate < targetRate) {
                    badgeClass = 'orange';
                } else {
                    badgeClass = 'red';
                }
                prevActual = currentActual; // Bir sonraki haftanın bazı güncelleniyor
            }

            // Kart HTML Yapısı
            const cardHTML = `
                <div class="week-card">
                    <div class="week-header">
                        <div class="week-title">
                            <span>Hafta</span> ${w}
                        </div>
                        <div class="target-amount">
                            Hedef: <strong>${formatTL(targetAmt)} ₺</strong>
                        </div>
                    </div>
                    
                    <div class="week-body">
                        <div class="actual-input-wrapper">
                            <span>₺</span>
                            <input 
                                type="number" 
                                class="actual-input" 
                                id="actual-${w}" 
                                placeholder="Ulaşılan Tutar" 
                                value="${currentActual !== undefined ? currentActual : ''}"
                                onchange="handleInput(${w})"
                            >
                        </div>
                        <div class="status-badge ${badgeClass}">
                            ${gainDisplay}
                        </div>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', cardHTML);
        }
    }

    // Uygulama yüklendiğinde başlat
    window.onload = renderApp;
</script>
</body>
</html>
