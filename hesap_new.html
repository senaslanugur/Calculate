<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Varlık Terminali (Haber & Grafik Optimizasyonu)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <!-- TradingView Lightweight Charts -->
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --bg-dark: #070b12; --panel-bg: #111827; --panel-border: #1f293d;
            --primary: #3b82f6; --primary-hover: #2563eb; --primary-glow: rgba(59, 130, 246, 0.35);
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
            --text-main: #f8fafc; --text-muted: #94a3b8; --input-bg: #090d16;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; padding-bottom: 40px; }

        /* Navbar */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--panel-border); position: sticky; top: 0; z-index: 50; }
        .logo { font-size: 1.25rem; font-weight: 900; letter-spacing: -0.5px; color: white; display: flex; align-items: center; gap: 8px; }
        .logo span { background: linear-gradient(135deg, var(--primary), #60a5fa); color: white; font-size: 0.7rem; padding: 3px 8px; border-radius: 6px; font-weight: 800; }
        
        .menu-container { position: relative; }
        .btn-hamburger { background: transparent; border: 1px solid var(--panel-border); color: var(--text-main); font-size: 1.2rem; padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn-hamburger:hover { background: var(--input-bg); border-color: var(--primary); color: var(--primary); }
        .dropdown-menu { position: absolute; right: 0; top: calc(100% + 12px); background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px; width: 240px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); opacity: 0; visibility: hidden; transform: translateY(-10px); transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        .dropdown-menu.active { opacity: 1; visibility: visible; transform: translateY(0); }
        .dropdown-item { display: flex; align-items: center; gap: 12px; padding: 14px 18px; color: var(--text-main); text-decoration: none; font-size: 0.9rem; font-weight: 600; border-bottom: 1px solid var(--panel-border); transition: 0.2s; }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover { background: rgba(255,255,255,0.05); }
        .dropdown-item.text-danger:hover { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

        /* Main Container */
        .app-container { max-width: 1240px; margin: 24px auto; padding: 0 20px; display: grid; gap: 24px; }
        @media (min-width: 1024px) { .app-container { grid-template-columns: 400px 1fr; } }

        /* Panels */
        .panel { background-color: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 20px; padding: 24px; box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3); margin-bottom: 24px; }
        .panel-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 20px; color: white; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 16px; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        select, input[type="text"], input[type="number"] { width: 100%; background-color: var(--input-bg); border: 1px solid var(--panel-border); color: white; padding: 14px; border-radius: 10px; font-size: 0.95rem; outline: none; transition: 0.2s; font-weight: 600; }
        select:focus, input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); background-color: #0d1424; }

        .btn { background-color: var(--primary); color: white; border: none; padding: 14px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 0.95rem; }
        .btn:hover { background-color: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 4px 12px var(--primary-glow); }
        .btn-outline { background-color: transparent; border: 1px solid var(--panel-border); color: var(--text-main); }
        .btn-outline:hover { background-color: rgba(255,255,255,0.05); border-color: var(--text-muted); }
        .btn-success { background-color: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .btn-success:hover { background-color: var(--success); color: white; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }

        /* Asset Card */
        .asset-card { background: var(--input-bg); border: 1px solid var(--panel-border); border-radius: 14px; padding: 16px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 12px; transition: all 0.2s ease; }
        .asset-card:hover { border-color: var(--primary); }
        .asset-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
        .asset-title-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1; }
        .asset-title { font-weight: 900; font-size: 1.05rem; color: white; }
        
        .badge-type { font-size: 0.65rem; padding: 3px 8px; border-radius: 6px; font-weight: 800; letter-spacing: 1px; }
        .bg-us { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
        .bg-tr { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .bg-manual { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }

        .signal-badge { font-size: 0.7rem; font-weight: 800; padding: 4px 8px; border-radius: 6px; letter-spacing: 0.5px; display: inline-flex; align-items: center; gap: 4px; cursor: help; }
        .signal-buy { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.4); }
        .signal-sell { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.4); }
        .signal-neutral { background: rgba(148, 163, 184, 0.1); color: var(--text-muted); border: 1px solid rgba(148, 163, 184, 0.2); }

        .asset-actions { display: flex; align-items: center; gap: 6px; }
        .btn-news { background: rgba(59, 130, 246, 0.1); color: var(--primary); border: 1px solid rgba(59, 130, 246, 0.3); font-size: 0.75rem; font-weight: 700; padding: 6px 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
        .btn-news:hover { background: var(--primary); color: white; }
        .btn-del { background: transparent; border: 1px solid transparent; color: var(--text-muted); cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 8px; }
        .btn-del:hover { color: var(--danger); background: rgba(239, 68, 68, 0.1); }

        .asset-info { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; background: rgba(255,255,255,0.02); padding: 6px 10px; border-radius: 6px; display: inline-block;}
        .asset-inputs { display: flex; gap: 16px; align-items: flex-end; margin-top: 4px; }
        .asset-val-display { text-align: right; font-size: 1.25rem; font-weight: 900; color: white; letter-spacing: -0.5px;}

        /* Dashboard Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 24px; }
        .stat-card { background: linear-gradient(135deg, var(--panel-bg), #101623); border: 1px solid var(--panel-border); padding: 24px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: relative; overflow: hidden;}
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--primary); }
        .stat-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 2.2rem; font-weight: 900; margin-top: 10px; color: white; letter-spacing: -1px; }
        .stat-sub { font-size: 0.85rem; margin-top: 8px; font-weight: 700; padding: 4px 10px; border-radius: 6px; display: inline-block; background: rgba(0,0,0,0.2);}

        .text-success { color: var(--success); } .text-warning { color: var(--warning); } .text-danger { color: var(--danger); }

        /* TradingView Lightweight Chart Container */
        .tv-chart-box { height: 350px; width: 100%; position: relative; border-radius: 12px; overflow: hidden; }

        /* History Table */
        .history-item { background-color: var(--input-bg); border: 1px solid var(--panel-border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 16px; transition: 0.3s; margin-bottom: 16px;}
        .history-item:hover { border-color: var(--primary); transform: translateY(-2px); }
        @media (min-width: 600px) { .history-item { flex-direction: row; justify-content: space-between; align-items: center; } }
        .history-week { font-weight: 900; font-size: 1.2rem; color: white; display: flex; align-items: center; gap: 10px; }
        .history-actions { display: flex; align-items: center; gap: 20px; }
        .btn-icon { background: var(--panel-bg); border: 1px solid var(--panel-border); color: var(--text-main); border-radius: 10px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .btn-icon:hover { background: var(--primary); color: white; border-color: var(--primary); }

        .badge { display: inline-block; padding: 6px 12px; border-radius: 8px; font-size: 0.9rem; font-weight: 800; margin-top: 8px; text-align: right;}
        .badge.green { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.4);}
        .badge.orange { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.4);}
        .badge.red { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.4);}

        /* SweetAlert2 Premium Modals */
        .swal2-popup.premium-modal { background: rgba(17, 24, 39, 0.96) !important; backdrop-filter: blur(20px) !important; color: white !important; border: 1px solid rgba(255,255,255,0.1) !important; border-radius: 24px !important; padding: 30px !important; }
        .swal2-title { color: white !important; font-weight: 900 !important; font-size: 1.4rem !important; }
        .premium-modal .swal2-actions { margin-top: 24px !important; gap: 14px; }
        .premium-modal .swal2-confirm { background: var(--primary) !important; border-radius: 10px !important; padding: 12px 24px !important; font-weight: 800 !important; }
        .premium-modal .swal2-cancel { background: transparent !important; border: 1px solid var(--panel-border) !important; color: white !important; border-radius: 10px !important; padding: 12px 24px !important; }

        .news-item { background: rgba(0,0,0,0.3); border: 1px solid var(--panel-border); padding: 18px; border-radius: 14px; margin-bottom: 14px; text-align: left; }
        .news-title a { color: white; text-decoration: none; font-weight: 800; font-size: 1rem; }
        .news-title a:hover { color: var(--primary); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 10px; }
    </style>
</head>
<body>

<!-- ÜST MENÜ -->
<header class="navbar">
    <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        ProPortföy <span>Terminal</span>
    </div>
    <div class="menu-container">
        <button class="btn-hamburger" id="menuBtn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
        </button>
        <div class="dropdown-menu" id="dropdownMenu">

                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                Piyasayı Senkronize Et
            </a>
            <a href="#" class="dropdown-item text-danger" onclick="resetAllData()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                Tüm Verileri Sıfırla
            </a>
        </div>
    </div>
</header>

<div class="app-container">
    
    <!-- SOL PANEL: Varlık Yönetimi -->
    <div class="sidebar">
        <div class="panel">
            <div class="panel-title">Strateji Ayarları</div>
            <div class="form-group">
                <label>Başlangıç Sermayesi (₺)</label>

            </div>
            <div class="form-group">
                <label>Haftalık Hedef Getiri (%)</label>

            </div>
        </div>

        <div class="panel">
            <div class="panel-title">
                Varlık Terminali
                <button onclick="forceSyncPrices()" class="btn-outline" style="width: auto; padding: 6px 14px; font-size: 0.75rem; border-radius: 8px; font-weight: 700;">🔄 Fiyatları Yenile</button>
            </div>
            
            <div id="assetsContainer" style="max-height: 400px; overflow-y: auto; padding-right: 6px; margin-bottom: 16px;"></div>

            <div class="form-group" style="display: flex; gap: 10px;">
                <button class="btn btn-outline" style="font-size: 0.85rem;" onclick="openAddLiveAssetModal()">+ Canlı Varlık</button>
                <button class="btn btn-outline" style="font-size: 0.85rem;" onclick="addManualAsset()">+ Nakit/Manuel</button>
            </div>

            <div style="background: var(--input-bg); padding: 18px; border-radius: 16px; margin: 20px 0; text-align: center; border: 1px solid var(--panel-border);">

            </div>

            <div class="form-group">
                <label>Kayıt Dönemi (Hafta)</label>

            </div>

            <div style="display: flex; gap: 12px;">
                <button class="btn" onclick="saveLog()">Günü Kaydet</button>
                <button class="btn btn-success" style="width: auto; padding: 0 20px;" onclick="startNextWeek()" title="Yeni Haftaya Geç">+</button>
            </div>
        </div>
    </div>

    <!-- SAĞ PANEL: TradingView Grafiği ve Tarihçe -->
    <div class="main-content">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Son Kayıtlı Portföy</div>
                <div class="stat-value" id="statCurrentTotal">0 ₺</div>
                <div class="stat-sub" id="statTotalProfit">Net Kar: %0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Teorik Hedef (Aktif Hafta)</div>
                <div class="stat-value" id="statTargetTotal">0 ₺</div>
                <div class="stat-sub text-warning" id="statDiff">Fark: 0 ₺</div>
            </div>
        </div>

        <!-- TradingView Lightweight Chart Paneli -->
        <div class="panel">
            <div class="panel-title">
                TradingView Büyüme Grafiği
                <span style="font-size: 0.75rem; color: var(--primary); font-weight: 600;">Canlı İnteraktif Eğri</span>
            </div>
            <div class="tv-chart-box" id="tvChartContainer"></div>
        </div>

        <!-- Haftalık Tarihçe -->
        <div class="panel">
            <div class="panel-title">Haftalık İlerleme Tarihçesi</div>
            <div class="history-list" id="historyContainer"></div>
        </div>
    </div>

</div>

<script>
    // --- Finansal Duygu Sözlüğü (Lexicon NLP) ---
    const FINANCE_LEXICON = {
        "beats": 3.0, "beat estimates": 3.5, "surge": 3.0, "rally": 2.5, "record high": 3.0, "upgrade": 2.5, "outperform": 2.5, "buyback": 2.0, "raises guidance": 3.0, "strong demand": 2.0, "profit rises": 2.5, "bullish": 2.5,
        "artış": 2.5, "yükseldi": 2.5, "rekor": 3.0, "kar açıkladı": 2.5, "beklentileri aştı": 3.5, "ihracat rekoru": 2.5, "yükseliş": 2.5, "temettü dağıtımı": 2.0, "tavan": 3.0, "büyüme": 2.0, "ihale kazandı": 3.0, "anlaşma imzaladı": 2.5,
        "misses": -3.0, "miss estimates": -3.5, "plunge": -3.0, "tumble": -2.5, "downgrade": -2.5, "underperform": -2.5, "layoffs": -2.5, "lawsuit": -2.0, "investigation": -2.0, "recall": -2.0, "guidance cut": -3.0, "profit falls": -2.5, "bearish": -2.5, "bankruptcy": -3.5, "fraud": -3.0,
        "düşüş": -2.5, "geriledi": -2.5, "zarar açıkladı": -3.0, "beklentilerin altında": -3.0, "soruşturma": -2.0, "iflas": -3.5, "işten çıkarma": -2.5, "dava": -1.5, "kar düşüşü": -2.5, "taban": -3.0, "bilanço hüsranı": -3.5
    };
    const NEGATIONS = ["değil", "aşamadı", "kalamadı", "düşmedi", "not", "didn't", "hasn't", "failed"];

    function analyzeHeadline(text) {
        if (!text) return { score: 0.0, label: "NÖTR", emoji: "⚪", reasons: ["Metin bulunamadı."] };
        let bonus = 0.0, hits = 0, matchedPos = [], matchedNeg = [];
        let textLower = text.toLowerCase();

        for (const [term, weight] of Object.entries(FINANCE_LEXICON)) {
            if (textLower.includes(term)) {
                let actualWeight = weight;
                let isNegated = false;
                let termIndex = textLower.indexOf(term);
                let precedingText = textLower.substring(Math.max(0, termIndex - 25), termIndex);
                for (let neg of NEGATIONS) { if (precedingText.includes(neg)) { isNegated = true; break; } }
                let followingText = textLower.substring(termIndex, termIndex + term.length + 15);
                for (let neg of NEGATIONS) { if (followingText.includes(neg)) { isNegated = true; break; } }

                if (isNegated) actualWeight = actualWeight * -0.5;
                bonus += actualWeight; hits += 1;
                if (actualWeight > 0) matchedPos.push(isNegated ? `(Zıt) ${term}` : term);
                else matchedNeg.push(isNegated ? `(Zıt) ${term}` : term);
            }
        }
        let score = hits > 0 ? Math.max(-1.0, Math.min(1.0, bonus / (3.5 * hits))) : 0;
        let reasons = [];
        if (matchedPos.length) reasons.push("Olumlu: " + matchedPos.join(", "));
        if (matchedNeg.length) reasons.push("Olumsuz: " + matchedNeg.join(", "));
        if (!matchedPos.length && !matchedNeg.length) reasons.push("Nötr piyasa etkisi.");

        if (score >= 0.15) return { score, label: "AL", emoji: "🟢", reasons };
        else if (score <= -0.15) return { score, label: "SAT", emoji: "🔴", reasons };
        else return { score, label: "NÖTR", emoji: "⚪", reasons };
    }

    // --- Haber Analiz & Çekim Motoru ---
    window.newsSignalCache = {}; 
    window.newsItemsCache = {};  

    async function fetchAndAnalyzeNewsSilently(ticker, type) {
        let filteredItems = [];
        const now = new Date();
        const past7Days = new Date(now.getTime() - (7 * 24 * 60 * 60 * 1000));

        try {
            if (type === 'US') {
                const toDate = now.toISOString().split('T')[0];
                const fromDate = past7Days.toISOString().split('T')[0];
                const res = await fetch(`https://finnhub.io/api/v1/company-news?symbol=${ticker}&from=${fromDate}&to=${toDate}&token=${FINNHUB_KEY}`);
                const data = await res.json();
                
                if (data && data.length > 0) {
                    data.slice(0, 15).forEach(news => {
                        const pubDate = new Date(news.datetime * 1000);
                        const sentiment = analyzeHeadline(news.headline);
                        filteredItems.push({ title: news.headline, link: news.url, date: pubDate.toLocaleString('tr-TR'), source: news.source, sentiment: sentiment, rawDate: pubDate });
                    });
                }
            } else {
                const cleanTicker = ticker.replace(".IS", ""); 
                const query = `${cleanTicker} hisse haber`; 
                const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(query)}&hl=tr&gl=TR&ceid=TR:tr`;
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(rssUrl)}`;
                
                const resp = await fetch(proxyUrl);
                const xmlText = await resp.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(xmlText, "application/xml");
                const items = xml.querySelectorAll("item");
                
                items.forEach(item => {
                    const title = item.querySelector("title")?.textContent || "";
                    const link = item.querySelector("link")?.textContent || "";
                    const pubDate = new Date(item.querySelector("pubDate")?.textContent || "");
                    const source = item.querySelector("source")?.textContent || "Haber Kaynağı";
                    
                    if (pubDate >= past7Days) {
                        const sentiment = analyzeHeadline(title);
                        filteredItems.push({ title, link, date: pubDate.toLocaleString('tr-TR'), source, sentiment, rawDate: pubDate });
                    }
                });
            }
            
            filteredItems.sort((a,b) => b.rawDate - a.rawDate);
            window.newsItemsCache[ticker] = filteredItems;

            if (filteredItems.length > 0) {
                let latestNews = filteredItems[0];
                let latestScore = latestNews.sentiment.score;

                let overallSignal = 'NÖTR';
                let signalClass = 'signal-neutral';
                if (latestScore >= 0.15) { overallSignal = 'AL'; signalClass = 'signal-buy'; }
                else if (latestScore <= -0.15) { overallSignal = 'SAT'; signalClass = 'signal-sell'; }

                window.newsSignalCache[ticker] = { signal: overallSignal, class: signalClass, score: latestScore, time: latestNews.date };
            } else {
                window.newsSignalCache[ticker] = { signal: 'NÖTR', class: 'signal-neutral', score: 0 };
            }

        } catch (e) {
            console.warn("Haber analizi başarısız oldu: ", e);
        }
    }

    function showAssetNewsModal(ticker) {
        const newsItems = window.newsItemsCache[ticker] || [];
        
        if (newsItems.length === 0) {
            Swal.fire({ title: `${ticker} Haberleri`, html: '<div style="padding: 20px; opacity: 0.6; font-weight:600;">Son 7 gün içerisinde piyasa haberi bulunamadı.</div>', customClass: { popup: 'premium-modal' }, confirmButtonText: 'Kapat' });
            return;
        }

        let html = '<div style="max-height: 450px; overflow-y: auto; padding-right: 8px;">';
        newsItems.forEach((item, index) => {
            let colorClass = item.sentiment.score >= 0.15 ? 'text-success' : (item.sentiment.score <= -0.15 ? 'text-danger' : 'text-muted');
            let isLatest = index === 0 ? '<span style="background:var(--primary);color:white;font-size:0.6rem;padding:2px 6px;border-radius:4px;margin-right:6px;vertical-align:middle;">SON HABER</span>' : '';
            
            html += `
                <div class="news-item" style="${index===0 ? 'border-color:var(--primary); box-shadow:0 0 15px rgba(59,130,246,0.15);' : ''}">
                    <div class="news-header">
                        <div class="news-title">${isLatest}<a href="${item.link}" target="_blank">${item.title}</a></div>
                        <div class="news-sentiment">
                            <div class="badge ${colorClass === 'text-success' ? 'green' : (colorClass === 'text-danger' ? 'red' : '')}">
                                ${item.sentiment.emoji} ${item.sentiment.label}
                            </div>
                            <div class="news-score">Skor: ${item.sentiment.score.toFixed(2)}</div>
                        </div>
                    </div>
                    <div style="font-size: 0.75rem; color: var(--text-muted);"><b>${item.source}</b> &bull; ${item.date}</div>
                    <div class="news-reasons">${item.sentiment.reasons.join('<br>')}</div>
                </div>
            `;
        });
        html += '</div>';

        Swal.fire({ title: `📰 ${ticker} Haber Akışı`, html: html, width: 750, showCloseButton: true, confirmButtonText: 'Kapat', customClass: { popup: 'premium-modal' } });
    }

    // --- Global Değişkenler & State ---
    const FINNHUB_KEY = 'c94i99aad3if4j50rvn0';
    const STORAGE_KEY = 'proApp_wealthTrackerFinal';
    
    let appData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
        baseCapital: 100000, targetRate: 5.0, currentWeekNum: 1, assets: [], weeks: [ { weekNum: 1, logs: [] } ]
    };

    let livePricesCache = {}; 
    let usdRateCache = 34.0;
    let tvChart = null, tvAreaSeries = null, tvTargetSeries = null;
    const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 3000, background: '#111827', color: '#f8fafc' });

    const formatTL = (num) => new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(num) + ' ₺';
    const formatPct = (num) => num.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
    const getTargetAmt = (weekNum) => appData.baseCapital * Math.pow(1 + (appData.targetRate / 100), weekNum);

    // --- Başlangıç ---
    async function init() {
        document.getElementById('baseCapital').value = appData.baseCapital;
        document.getElementById('targetRate').value = appData.targetRate;
        updateWeekDropdown();
        initLightweightChart();
        await fetchAllLivePrices();
        updateDashboard();
    }

    // --- TRADINGVIEW LIGHTWEIGHT CHARTS ---
    function initLightweightChart() {
        const container = document.getElementById('tvChartContainer');
        container.innerHTML = '';

        tvChart = LightweightCharts.createChart(container, {
            layout: { background: { color: '#090d16' }, textColor: '#94a3b8', fontFamily: "'Inter', sans-serif" },
            grid: { vertLines: { color: 'rgba(255, 255, 255, 0.03)' }, horzLines: { color: 'rgba(255, 255, 255, 0.03)' } },
            crosshair: { vertLine: { color: '#3b82f6', width: 1, style: 2 }, horzLine: { color: '#3b82f6', width: 1, style: 2 } },
            rightPriceScale: { borderColor: 'rgba(255, 255, 255, 0.1)' },
            timeScale: { borderColor: 'rgba(255, 255, 255, 0.1)', timeVisible: true, secondsVisible: false },
            handleScroll: { mouseWheel: true, pressedMouseMove: true },
            handleScale: { axisPressedMouseMove: true, mouseWheel: true, pinch: true }
        });

        tvAreaSeries = tvChart.addAreaSeries({
            lineColor: '#3b82f6', topColor: 'rgba(59, 130, 246, 0.4)', bottomColor: 'rgba(59, 130, 246, 0.01)',
            lineWidth: 3, priceFormat: { type: 'custom', formatter: val => formatTL(val) }
        });

        tvTargetSeries = tvChart.addLineSeries({
            color: '#ef4444', lineWidth: 2, lineStyle: 2, priceFormat: { type: 'custom', formatter: val => formatTL(val) }
        });

        window.addEventListener('resize', () => { if (tvChart) tvChart.resize(container.clientWidth, 350); });
    }

    function updateLightweightChartData() {
        if (!tvChart || !tvAreaSeries) return;

        const weeksWithLogs = appData.weeks.filter(w => w.logs.length > 0);
        const baseDate = new Date();
        baseDate.setDate(baseDate.getDate() - (weeksWithLogs.length * 7));

        let actualTVData = [];
        let targetTVData = [];

        let d0 = new Date(baseDate);
        let time0 = d0.toISOString().split('T')[0];
        actualTVData.push({ time: time0, value: appData.baseCapital });
        targetTVData.push({ time: time0, value: appData.baseCapital });

        weeksWithLogs.forEach((w, i) => {
            let d = new Date(baseDate);
            d.setDate(d.getDate() + ((i + 1) * 7));
            let timeStr = d.toISOString().split('T')[0];

            actualTVData.push({ time: timeStr, value: w.logs[w.logs.length - 1].total });
            targetTVData.push({ time: timeStr, value: getTargetAmt(w.weekNum) });
        });

        tvAreaSeries.setData(actualTVData);
        tvTargetSeries.setData(targetTVData);
        tvChart.timeScale().fitContent();
    }

    // --- State & Dashboard ---
    function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); }

    function updateSettings() {
        appData.baseCapital = parseFloat(document.getElementById('baseCapital').value) || 0;
        appData.targetRate = parseFloat(document.getElementById('targetRate').value) || 0;
        saveData(); updateDashboard();
        Toast.fire({ icon: 'success', title: 'Strateji güncellendi' });
    }

    async function fetchUsdTryRate() {
        try { const res = await fetch('https://api.frankfurter.dev/v2/rates?base=USD&quotes=TRY'); const data = await res.json(); return data[0]?.rate || 34.0; } 
        catch(e) { return 34.0; }
    }

    async function fetchUSPrice(symbol) {
        try { const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${FINNHUB_KEY}`); const data = await res.json(); return data.c || 0; } 
        catch(e) { return 0; }
    }

    async function fetchTRPrice(symbol) {
        try {
            const now = Math.floor(Date.now() / 1000); const fromDate = now - (30 * 24 * 60 * 60); 
            const res = await fetch(`https://gate.fintables.com/barbar/udf/history?symbol=${encodeURIComponent(symbol)}&resolution=D&from=${fromDate}&to=${now}`);
            const data = await res.json();
            return (data && data.c?.length > 0) ? data.c[data.c.length - 1] : 0;
        } catch(e) { return 0; }
    }

    async function fetchAllLivePrices() {
        Swal.fire({ title: 'Terminal Güncelleniyor', html: 'Portföyünüz taranıyor...', allowOutsideClick: false, customClass: { popup: 'premium-modal' }, didOpen: () => { Swal.showLoading(); } });
        usdRateCache = await fetchUsdTryRate();
        let fetchPromises = [];

        window.newsSignalCache = window.newsSignalCache || {};

        for (let asset of appData.assets) {
            if (asset.type === 'US') fetchPromises.push(fetchUSPrice(asset.name).then(p => livePricesCache[asset.name] = p));
            else if (asset.type === 'TR') fetchPromises.push(fetchTRPrice(asset.name).then(p => livePricesCache[asset.name] = p));
            
            // Fiyatla birlikte arka planda haber analizi de çek
            if (asset.type !== 'MANUAL') {
                fetchPromises.push(fetchAndAnalyzeNewsSilently(asset.name, asset.type));
            }
        }
        
        await Promise.all(fetchPromises);
        Swal.close(); renderAssets();
    }

    function renderAssets() {
        const container = document.getElementById('assetsContainer');
        let totalLiveValue = 0; let html = '';

        appData.assets.forEach(asset => {
            let assetTotalTRY = 0;

            if (asset.type === 'MANUAL') {
                assetTotalTRY = asset.manualValue;
                html += `
                    <div class="asset-card">
                        <div class="asset-header">
                            <div class="asset-title-group">
                                <input type="text" value="${asset.name}" onchange="updateAsset('${asset.id}', 'name', this.value)" style="background:transparent; border:none; font-size:1.05rem; font-weight:900; color:white; outline:none; max-width:180px;">
                                <span class="badge-type bg-manual">MANUEL</span>
                            </div>
                            <div class="asset-actions">
                                <button class="btn-del" onclick="removeAsset('${asset.id}')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
                            </div>
                        </div>
                        <div class="asset-inputs">
                            <div style="flex: 1;">
                                <label style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700;">Değer (₺)</label>
                                <input type="number" value="${asset.manualValue}" oninput="updateAsset('${asset.id}', 'manualValue', this.value)" style="padding: 10px; width: 100%; margin-top: 6px;">
                            </div>
                        </div>
                    </div>`;
            } else {
                const price = livePricesCache[asset.name] || 0;
                let displaySubText = '';
                
                if (asset.type === 'US') {
                    assetTotalTRY = (asset.amount * price) * usdRateCache;
                    displaySubText = `Fiyat: $${price.toFixed(2)} &bull; Kur: ₺${usdRateCache.toFixed(2)}`;
                } else if (asset.type === 'TR') {
                    assetTotalTRY = asset.amount * price;
                    displaySubText = `Canlı Fiyat: ₺${price.toFixed(4)}`;
                }

                const signalData = window.newsSignalCache[asset.name] || { signal: 'NÖTR', class: 'signal-neutral', score: 0 };
                let signalTooltip = signalData.score !== 0 ? `Son Haber Skoru: ${signalData.score.toFixed(2)}` : 'Haber bulunamadı';

                html += `
                    <div class="asset-card">
                        <div class="asset-header">
                            <div class="asset-title-group">
                                <div class="asset-title">${asset.name}</div>
                                <span class="badge-type ${asset.type === 'US' ? 'bg-us' : 'bg-tr'}">${asset.type}</span>
                                <div class="signal-badge ${signalData.class}" title="${signalTooltip}">${signalData.signal}</div>
                            </div>
                            <div class="asset-actions">
                                <button onclick="showAssetNewsModal('${asset.name}')" class="btn-news" title="Son Haber Analizi">📰 Haber</button>
                                <button class="btn-del" onclick="removeAsset('${asset.id}')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
                            </div>
                        </div>
                        <div class="asset-info">${displaySubText}</div>
                        <div class="asset-inputs">
                            <div style="flex: 1;">
                                <label style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700;">Adet / Miktar</label>
                                <input type="number" step="0.0001" value="${asset.amount}" oninput="updateAsset('${asset.id}', 'amount', this.value)" style="padding: 10px; width: 100%; margin-top: 6px;">
                            </div>
                            <div class="asset-val-display" style="flex: 1; margin-bottom: 4px;">
                                ${formatTL(assetTotalTRY)}
                            </div>
                        </div>
                    </div>`;
            }
            totalLiveValue += assetTotalTRY;
        });

        container.innerHTML = html; 
        document.getElementById('liveTotal').innerText = formatTL(totalLiveValue);
    }

    function openAddLiveAssetModal() {
        Swal.fire({
            title: 'Canlı Varlık Ekle',
            html: `
                <div style="margin-bottom: 16px; text-align: left;">
                    <label style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">Hisse / Fon Kodu</label>
                    <input id="swal-asset-symbol" style="width: 100%; background: var(--input-bg); border: 1px solid var(--panel-border); color: white; padding: 14px; border-radius: 10px; font-weight: 700; margin-top: 6px;" placeholder="Örn: NVDA, THYAO" style="text-transform: uppercase;">
                </div>
                <div style="margin-bottom: 16px; text-align: left;">
                    <label style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">Piyasa</label>
                    <select id="swal-asset-type" style="width: 100%; background: var(--input-bg); border: 1px solid var(--panel-border); color: white; padding: 14px; border-radius: 10px; font-weight: 700; margin-top: 6px;">
                        <option value="US">ABD Borsası (USD)</option>
                        <option value="TR">Türkiye (BİST / TEFAS)</option>
                    </select>
                </div>
                <div style="text-align: left;">
                    <label style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">Adet</label>
                    <input id="swal-asset-amount" type="number" style="width: 100%; background: var(--input-bg); border: 1px solid var(--panel-border); color: white; padding: 14px; border-radius: 10px; font-weight: 700; margin-top: 6px;" placeholder="10">
                </div>
            `,
            showCancelButton: true, confirmButtonText: 'Ekle', cancelButtonText: 'İptal', customClass: { popup: 'premium-modal' },
            preConfirm: () => {
                const name = document.getElementById('swal-asset-symbol').value.toUpperCase().trim();
                const type = document.getElementById('swal-asset-type').value;
                const amount = parseFloat(document.getElementById('swal-asset-amount').value) || 0;
                if (!name || amount <= 0) { Swal.showValidationMessage('Geçerli değerler girin.'); return false; }
                return { id: Date.now().toString(), name, type, amount, manualValue: 0 };
            }
        }).then(async (result) => {
            if (result.isConfirmed) { appData.assets.push(result.value); saveData(); await fetchAllLivePrices(); }
        });
    }

    function addManualAsset() { appData.assets.push({ id: Date.now().toString(), name: 'Nakit Portföyü', type: 'MANUAL', amount: 1, manualValue: 0 }); saveData(); renderAssets(); }
    function removeAsset(id) { appData.assets = appData.assets.filter(a => a.id !== id); saveData(); renderAssets(); }
    function updateAsset(id, field, value) { const asset = appData.assets.find(a => a.id === id); if (asset) { asset[field] = field === 'name' ? value : (parseFloat(value) || 0); saveData(); renderAssets(false); } }

    function updateWeekDropdown() {
        const select = document.getElementById('activeWeekSelect'); select.innerHTML = '';
        appData.weeks.forEach(w => {
            const opt = document.createElement('option'); opt.value = w.weekNum; opt.innerText = `Hafta ${w.weekNum} ${w.weekNum === appData.currentWeekNum ? '(Aktif)' : ''}`;
            if(w.weekNum === appData.currentWeekNum) opt.selected = true; select.appendChild(opt);
        });
    }

    function startNextWeek() {
        appData.currentWeekNum++;
        if(!appData.weeks.find(w => w.weekNum === appData.currentWeekNum)) appData.weeks.push({ weekNum: appData.currentWeekNum, logs: [] });
        saveData(); updateWeekDropdown(); Toast.fire({ icon: 'success', title: `Hafta ${appData.currentWeekNum} başlatıldı!` });
    }

    function saveLog() {
        const selectedWeekNum = parseInt(document.getElementById('activeWeekSelect').value);
        let week = appData.weeks.find(w => w.weekNum === selectedWeekNum);
        let total = 0, walletsSnapshot = {};

        appData.assets.forEach(asset => {
            let val = 0;
            if (asset.type === 'MANUAL') val = asset.manualValue;
            else if (asset.type === 'US') val = (asset.amount * (livePricesCache[asset.name]||0)) * usdRateCache;
            else if (asset.type === 'TR') val = asset.amount * (livePricesCache[asset.name]||0);
            total += val; if(val > 0) walletsSnapshot[`${asset.name} (${asset.type})`] = val;
        });

        if(total <= 0) { Toast.fire({ icon: 'error', title: 'Toplam varlık 0 olamaz.' }); return; }

        const now = new Date(); const dateKey = now.toLocaleDateString('tr-TR'); const fullDateDisplay = dateKey + ' ' + now.toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'});
        const existingLogIndex = week.logs.findIndex(l => l.dateKey === dateKey || (l.date && l.date.startsWith(dateKey)));
        const newLogEntry = { dateKey, date: fullDateDisplay, wallets: walletsSnapshot, total };

        if (existingLogIndex >= 0) week.logs[existingLogIndex] = newLogEntry; 
        else week.logs.push(newLogEntry);

        saveData(); updateDashboard();
        Toast.fire({ icon: 'success', title: 'Kayıt başarıyla işlendi!' });
    }

    function updateDashboard() {
        let latestTotal = appData.baseCapital;
        for(let i = appData.weeks.length - 1; i >= 0; i--) { 
            if(appData.weeks[i].logs.length > 0) { latestTotal = appData.weeks[i].logs[appData.weeks[i].logs.length - 1].total; break; } 
        }
        
        const currentTarget = getTargetAmt(appData.currentWeekNum);
        document.getElementById('statCurrentTotal').innerText = formatTL(latestTotal);
        document.getElementById('statTargetTotal').innerText = formatTL(currentTarget);
        
        const netProfit = latestTotal - appData.baseCapital;
        const netProfitPct = ((latestTotal - appData.baseCapital) / appData.baseCapital) * 100;
        const diff = latestTotal - currentTarget;
        
        const totalProfitEl = document.getElementById('statTotalProfit');
        totalProfitEl.innerText = `Net Kar: ${formatTL(netProfit)} (%${netProfitPct.toFixed(2)})`;
        totalProfitEl.className = 'stat-sub ' + (netProfit >= 0 ? 'text-success' : 'text-danger');

        const statDiffEl = document.getElementById('statDiff');
        statDiffEl.innerText = `Hedefe Göre Fark: ${diff >= 0 ? '+' : ''}${formatTL(diff)}`;
        statDiffEl.className = 'stat-sub ' + (diff >= 0 ? 'text-success' : 'text-danger');

        renderHistory();
        updateLightweightChartData();
    }

    function renderHistory() {
        const container = document.getElementById('historyContainer'); container.innerHTML = '';
        const weeksWithLogs = appData.weeks.filter(w => w.logs.length > 0);

        if(weeksWithLogs.length === 0) { container.innerHTML = '<div style="color:var(--text-muted); padding:20px; text-align:center;">Henüz kayıt bulunmuyor.</div>'; return; }

        [...weeksWithLogs].reverse().forEach(week => {
            const lastLog = week.logs[week.logs.length - 1];
            let prevTotal = appData.baseCapital; 
            if(week.weekNum > 1) {
                const prev = appData.weeks.find(w => w.weekNum === week.weekNum - 1);
                if(prev && prev.logs.length > 0) prevTotal = prev.logs[prev.logs.length - 1].total;
            }
            const gainPct = ((lastLog.total - prevTotal) / prevTotal) * 100;
            let badgeClass = gainPct >= appData.targetRate ? 'green' : (gainPct >= 0 ? 'orange' : 'red');

            container.innerHTML += `
                <div class="history-item">
                    <div>
                        <div class="history-week">Hafta ${week.weekNum} <span style="font-size:0.8rem; opacity:0.6; font-weight:600;">(${lastLog.date})</span></div>
                        <div style="font-size:0.85rem; color:var(--text-muted); margin-top:6px;">${week.logs.length} Günlük Kayıt &bull; ${Object.keys(lastLog.wallets).length} Varlık Kalemi</div>
                    </div>
                    <div class="history-actions">
                        <div style="text-align: right;">
                            <div style="font-size: 1.35rem; font-weight: 900; color: white;">${formatTL(lastLog.total)}</div>
                            <div class="badge ${badgeClass}">${(gainPct > 0 ? '+' : '') + formatPct(gainPct)}</div>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    // Hamburger Dropdown Event
    const menuBtn = document.getElementById('menuBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');
    menuBtn.addEventListener('click', (e) => { e.stopPropagation(); dropdownMenu.classList.toggle('active'); });
    document.addEventListener('click', (e) => { if (!dropdownMenu.contains(e.target) && e.target !== menuBtn) dropdownMenu.classList.remove('active'); });

    function resetAllData() {
        dropdownMenu.classList.remove('active');
        Swal.fire({
            title: 'Sistemi Sıfırla',
            html: "Tüm portföy verileriniz sıfırlanacak. Onaylıyor musunuz?",
            icon: 'warning', showCancelButton: true, confirmButtonText: 'Sıfırla', cancelButtonText: 'İptal',
            customClass: { popup: 'premium-modal' }, confirmButtonColor: '#ef4444'
        }).then((result) => {
            if (result.isConfirmed) { localStorage.removeItem(STORAGE_KEY); location.reload(); }
        });
    }

    function forceSyncPrices() {
        dropdownMenu.classList.remove('active');
        fetchAllLivePrices();
    }

    window.onload = init;
</script>

</body>
